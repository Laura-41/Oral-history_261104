# 口述史两份试标专用 Neo4j 实例
# 与“以往工作”中的旧数据库完全分离
initial.dbms.default_database=neo4j
dbms.security.auth_enabled=false

# 通过英文软链接访问工程内的真实目录；文件仍保存在论文工程中。
server.directories.data=/tmp/oral_history_neo4j_demo/data
server.directories.logs=/tmp/oral_history_neo4j_demo/logs
server.directories.run=/tmp/oral_history_neo4j_demo/run
server.directories.import=/tmp/oral_history_neo4j_demo/import
server.directories.transaction.logs.root=/tmp/oral_history_neo4j_demo/data/transactions

# 旧版写法（适配你当前版本！重点）
server.bolt.enabled=true
server.bolt.listen_address=127.0.0.1:7687
server.bolt.advertised_address=127.0.0.1:7687

server.http.enabled=true
server.http.listen_address=127.0.0.1:7474
server.http.advertised_address=127.0.0.1:7474

server.https.enabled=false

# 内存
server.memory.heap.initial_size=256m
server.memory.heap.max_size=768m
server.memory.pagecache.size=256m
